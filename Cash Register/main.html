<!DOCTYPE html>
<html lang="en">

  <body>
    <script>
      let payment = 50;
      let price = 5.21;
      let change = payment - price;
      let displayObj = {};
      let cid = [
        { money: "Penny", amount: 20, value: 0.01 }, // 0.01 * 25
        { money: "Nickel", amount: 15, value: 0.05 }, // 0.05 * 6
        { money: "Dime", amount: 50, value: 0.1 }, // 0.1 * 3
        { money: "Quarter", amount: 15, value: 0.25 }, // 0.25 * 4
        { money: "Dollar", amount: 10, value: 1 }, // 1 * 3
        { money: "Five Dollars", amount: 8, value: 5 }, // 5 * 7
        { money: "Ten Dollars", amount: 5, value: 10 }, // 10 * 8
        { money: "Twenty Dollars", amount: 3, value: 20 }, // 20 * 2
        { money: "One Hundred Dollars", amount: 2, value: 100 }, // 100 * 1
      ];

      const Subtract = (obj) => {
        obj.amount = obj.amount - 1;
        if (!displayObj[obj.money]) {
          displayObj[obj.money] = {
            money: obj.money,
            total: obj.amount * obj.value,
          };
        } else {
          displayObj[obj.money].total += obj.amount * obj.value;
        }
      };
      /*   const convert = () => {
        let result = "";
        Object.values(displayObj).forEach((element) => {
          console.log(`${element.money}: ${element.total}`);
        });
      };*/

      const ReturnCondition = () => {
        if (change > 0) {
          Calculate();
        } else {
          return;
        }
      };
      let count = 0;
      const Calculate = () => {

        count++;
        if (change >= 100) {
          change = change - cid[8].value;
          Subtract(cid[8]);
          return Calculate();
        } else if (change >= 20 && change < 100) {
          change = change - cid[7].value;
          Subtract(cid[7]);
          return Calculate();
        } else if (change >= 10 && change < 20) {
          change = change - cid[6].value;
          Subtract(cid[6]);
          return Calculate();
        } else if (change >= 5 && change < 10) {
          change = change - cid[5].value;
          Subtract(cid[5]);
          return Calculate();
        } else if (change >= 1 && change < 5) {
          change = change - cid[4].value;
          Subtract(cid[4]);
          return Calculate();
        } else if (change >= 0.25 && change < 1) {
          change = change - cid[3].value;
          Subtract(cid[3]);
          return Calculate();
        } else if (change >= 0.1 && change < 0.25) {
          change = change - cid[2].value;
          Subtract(cid[2]);
          return Calculate();
        } else if (change >= 0.05 && change < 0.1) {
          change = change - cid[1].value;
          Subtract(cid[1]);
          return Calculate();
        } else if (change >= 0.01 && change < 0.05) {
          change = change - cid[0].value;
          Subtract(cid[0]);
          return Calculate();
        }

        if (change === 0) {
          console.log("Status: Closed");
        }
      };
      Calculate();

      console.log(count);
      Object.values(displayObj).forEach((element) => {
        console.log(`${element.money}: ${element.total}`);
      });
    </script>
