<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .receipt {
        width: 250px;
        background: white;
        border: 2px dashed #ccc;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .shop-name {
        font-size: 1.2rem;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
      }

      .info {
        text-align: center;
        font-size: 0.85rem;
        margin-bottom: 15px;
      }

      .receipt table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
        font-size: 0.85rem;
      }

      .receipt table th,
      .receipt table td {
        padding: 4px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }

      .total {
        display: flex;
        justify-content: space-between;
        font-size: 1rem;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .barcode {
        display: flex;
        justify-content: center;
        margin-top: 15px;
      }

      .thanks {
        font-size: 0.85rem;
        text-align: center;
        margin-top: 10px;
      }
      input::placeholder {
        color: black;
        font-weight: bold;
        opacity: 0.8;
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body
    style="
      width: 100vw;
      height: 100vh;
      background-color: rgb(61, 61, 61);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-direction: column;
    "
  >
    <div class="receipt">
      <p class="shop-name">Market</p>
      <p class="info">
        1234 Market Street, Suite 101<br />
        City, State ZIP<br />
        <span style="font-weight: bold; font-size: large">Your bill id:</span
        ><br />
        <span id="status">15632</span>
      </p>

      <table>
        <thead>
          <tr>
            <th>Total :</th>
            <th><span id="price"></span></th>
            <th></th>
          </tr>
        </thead>
      </table>
      <div id="change-due" style="width: 80%"></div>

      <div class="total">
        <p>Your change:</p>
        <p id="change">0</p>
      </div>

      <p class="thanks">Thank you for shopping with us!</p>
    </div>

    <div
      style="
        width: 300px;
        height: 300px;
        background-color: rgb(36, 36, 36);
        margin-top: -8px;
        border-radius: 5px;
        border: 3px solid black;
      "
    >
      <div
        style="
          width: 100%;
          height: 50px;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <input
          id="cash"
          type="number"
          style="
            outline: none;
            width: 90%;
            height: 50%;
            border: 4px solid black;
            text-align: center;
            background-color: rgb(92, 112, 92);
            color: black;
            font-weight: bold;
          "
          placeholder=" Enter Your Payment Here"
        />
      </div>
      <div
        style="
          width: 100%;
          height: 25px;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <button
          id="purchase-btn"
          style="
            width: 30%;
            font-weight: bold;
            background-color: rgb(16, 36, 16);
            color: rgb(0, 0, 0);
          "
        >
          PAY
        </button>
      </div>
      <div
        style="
          width: 100%;
          height: 70%;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <table style="font-size: 15px">
          <thead>
            <tr></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <script>
      let price = 19.5;
      let cid = [
        ["PENNY", 0.01],
        ["NICKEL", 0],
        ["DIME", 0],
        ["QUARTER", 0],
        ["ONE", 1],
        ["FIVE", 0],
        ["TEN", 0],
        ["TWENTY", 0],
        ["ONE HUNDRED", 0],
      ];

      const denominations = [
        ["PENNY", 1],
        ["NICKEL", 5],
        ["DIME", 10],
        ["QUARTER", 25],
        ["ONE", 100],
        ["FIVE", 500],
        ["TEN", 1000],
        ["TWENTY", 2000],
        ["ONE HUNDRED", 10000],
      ];

      document.getElementById("price").textContent = price;
      const change_due = document.getElementById("change-due");
      const tbody = document.getElementById("tbody");


      const displaycurrent = () => {
        tbody.innerHTML = ``;
        cid.forEach((element) => {
          tbody.innerHTML += `
      <tr>
        <td>${element[0]}</td>
        <td>: $${element[1].toFixed(2)}</td>
      </tr>`;
        });
      };
      displaycurrent();

      function CalculateChange(raw_change, drawer) {
        let changeDue = Math.round(raw_change * 100); 
        let totalCid = Math.round(
          drawer.reduce((sum, m) => sum + m[1], 0) * 100
        );
        let changeArr = [];


        for (let i = denominations.length - 1; i >= 0; i--) {
          let coinName = denominations[i][0];
          let coinVal = denominations[i][1];
          let drawerAmt = Math.round(drawer[i][1] * 100);
          let toGive = 0;

          while (changeDue >= coinVal && drawerAmt > 0) {
            changeDue -= coinVal;
            drawerAmt -= coinVal;
            toGive += coinVal;
          }

          if (toGive > 0) {
            changeArr.push([coinName, toGive / 100]);
          }
        }


        if (changeDue > 0) {
          change_due.textContent = "Status: INSUFFICIENT_FUNDS";
          return false;
        }


        if (Math.round(raw_change * 100) === totalCid) {
          change_due.innerHTML =
            "Status: CLOSED " +
            changeArr.map(([name, amt]) => `${name}: $${amt}`).join(" ");
          return true;
        }

    
        change_due.innerHTML =
          "Status: OPEN " +
          changeArr.map(([name, amt]) => `${name}: $${amt}`).join(" ");
        return true;
      }

      document.getElementById("purchase-btn").addEventListener("click", () => {
        let payment = Number(document.getElementById("cash").value);
        let raw_change = payment - price;
        let change = Math.round(raw_change * 100) / 100;
        document.getElementById("change").textContent = change.toFixed(2);

        if (payment < price) {
          alert("Customer does not have enough money to purchase the item");
          return;
        }
        if (Math.abs(raw_change) < 0.001) {
          change_due.textContent =
            "No change due - customer paid with exact cash";
          return;
        }

        let drawerCopy = cid.map((c) => [...c]);
        let success = CalculateChange(raw_change, drawerCopy);
        if (!success) return;
        displaycurrent();
      });
    </script>
  
  </body>
</html>
